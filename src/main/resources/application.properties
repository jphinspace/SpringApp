spring.application.name=Web Application Test

# Default profile
spring.profiles.active=dev

# See application-dev.properties and application-prod.properties for environment-specific settings

# Enable detailed logging
logging.level.org.springframework.context.annotation=DEBUG
logging.level.org.springframework.boot.web.embedded.tomcat=DEBUG
logging.level.org.springframework.jdbc=DEBUG

# Rate Limiting Configuration
rate.limit.capacity=30
rate.limit.time=1

# HTTPS Configuration
server.port=8443
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-alias=tomcat
server.ssl.enabled=true

# Security Headers
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.platform=h2

# Thymeleaf Configuration
spring.thymeleaf.cache=false